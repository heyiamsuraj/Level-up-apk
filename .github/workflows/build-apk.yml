name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or newer (detected: $JAVA_VER)."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK not found!"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty!"
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: $TARGET_APK does not have .apk extension!"; exit 1 ;;
          esac
          echo "Verified $TARGET_APK exists, is regular, non-empty, and has .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$ASSET_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/app-debug.apk"
          if [ ! -s "$ASSET_DIR/app-debug.apk" ]; then
            echo "ERROR: Prepared release asset is missing or empty!"
            exit 1
          fi
          echo "asset_path=${ASSET_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Asset file $ASSET_PATH is invalid or empty!"
            exit 1
          fi
          ASSET_BASENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_BASENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be exactly app-debug.apk (found: $ASSET_BASENAME)!"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="### Automated Debug APK Build

- **Artifact**: app-debug.apk
- **Build System**: GitHub Actions
- **Run Number**: ${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Commit**: ${{ github.sha }}

> **Note**: This is an automatically generated debug APK intended for testing purposes only. It is not a Play Store production release and is signed only with a temporary debug keystore."

          echo "Creating release $RELEASE_TAG for commit ${{ github.sha }}..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=== RELEASE SUCCESSFUL ==="
            gh release view "$RELEASE_TAG"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> Backup artifact \`app-debug-apk\` is also stored in GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=== WARNING: RELEASE PUBLISHING FAILED ==="
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK build succeeded and Actions artifact 'app-debug-apk' remains available as a backup."
            else
              echo "APK build did not produce an artifact."
            fi
            {
              echo "## APK Build & Release Summary"
              echo ""
              echo "Release publishing encountered an error, but the backup artifact \`app-debug-apk\` remains available in GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
